apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: url-shortener
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/url-shortener:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: DATABASE_PATH, value: /data/url-shortener.db}
            - {name: BASE_DOMAIN, value: url.shinkeonkim.com}
          envFrom:
            - secretRef: {name: url-shortener-secrets}
          readinessProbe: &probe
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe: *probe
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: url-shortener-data}
        - name: tmp
          emptyDir: {}
