<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Shortener Admin</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main><h1>URL Shortener</h1><p class="muted">관리자 콘솔</p>
<section id="login"><h2>로그인</h2><form id="login-form"><label>사용자명<input name="username" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section>
<section id="manage" hidden><h2>새 짧은 URL</h2><form id="url-form"><label>Slug<input name="slug" pattern="[a-z0-9-]{1,63}" placeholder="my-link" required></label><label>원본 URL<input name="target_url" type="url" placeholder="https://example.com" required></label><button>생성</button></form><div id="result"></div><hr><h2>통계 조회</h2><form id="stats-form"><label>Slug<input name="slug" required></label><button>조회</button></form><pre id="stats"></pre><button id="logout" class="secondary">로그아웃</button></section>
<p id="message" role="status"></p></main><script src="/assets/app.js" defer></script></body></html>
